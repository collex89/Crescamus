<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Matches the .app-header background (--surface), not the brand blue --
         a status bar in the brand color left a visible seam against the
         white/dark header underneath it. Two tags for the initial paint
         before React mounts (OS-level dark mode); App.jsx updates this
         live when the user flips the in-app Dark Mode toggle, which is
         independent of the OS setting. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131A26" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crescamus" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Crescamus is a premium, elegant Catholic social platform. Share faith-filled content, read the Catholic Bible, discover saints, listen to Catholic audio, and build a consistent prayer life." />
    <link rel="canonical" href="https://crescamus.app" />
    <meta property="og:site_name" content="Crescamus" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crescamus.app" />
    <meta property="og:title" content="Crescamus – Growing Together in Christ" />
    <meta property="og:description" content="Crescamus is a premium, elegant Catholic social platform. Share faith-filled content, read the Catholic Bible, discover saints, listen to Catholic audio, and build a consistent prayer life." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Crescamus – Growing Together in Christ" />
    <meta name="twitter:description" content="Crescamus is a premium, elegant Catholic social platform. Share faith-filled content, read the Catholic Bible, discover saints, listen to Catholic audio, and build a consistent prayer life." />
    <!-- Typography: Inter, Poppins, Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Crescamus – Growing Together in Christ</title>
    <!-- Tells search engines these accounts are the official ones for
         crescamus.app (shown with the site in results). Keep in step with
         SOCIAL_LINKS / CONTACT_EMAIL in src/data/aboutContent.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Crescamus",
        "url": "https://www.crescamus.app",
        "logo": "https://www.crescamus.app/icons/icon-512.png",
        "email": "hello@crescamus.app",
        "sameAs": [
          "https://www.instagram.com/crescamus.app/",
          "https://www.linkedin.com/company/crescamusapp/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
